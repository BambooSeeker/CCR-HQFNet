name: Verify released metrics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment/requirements-demo.txt
      - name: Install verification dependencies
        run: python -m pip install -r environment/requirements-demo.txt
      - name: Recompute released metrics
        run: python run_demo.py
